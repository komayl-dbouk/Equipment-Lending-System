services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: equipment_lending
      POSTGRES_USER: ${ELS_DB_USERNAME:?Set ELS_DB_USERNAME in your environment}
      POSTGRES_PASSWORD: ${ELS_DB_PASSWORD:?Set ELS_DB_PASSWORD in your environment}
    ports:
      - "${ELS_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
