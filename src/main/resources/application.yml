spring:
  application:
    name: equipment-lending-system
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${ELS_DB_URL}
    username: ${ELS_DB_USERNAME}
    password: ${ELS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  clock-zone: Asia/Beirut
  security:
    staff:
      username: ${ELS_STAFF_USERNAME:}
      password: ${ELS_STAFF_PASSWORD:}

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: 'OFF'

management:
  endpoint:
    health:
      show-components: never
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
